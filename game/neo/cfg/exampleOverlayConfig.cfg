// Enables overlay and bind keys relative to overlay's HUD
cl_neo_hud_spectator_overlay_enabled 1

bind 1 "spec_player_by_overlay_position 0"
bind 2 "spec_player_by_overlay_position 1"
bind 3 "spec_player_by_overlay_position 2"
bind 4 "spec_player_by_overlay_position 3"
bind 5 "spec_player_by_overlay_position 4"
bind 6 "spec_player_by_overlay_position 5"
bind 7 "spec_player_by_overlay_position 6"
bind 8 "spec_player_by_overlay_position 7"
bind 9 "spec_player_by_overlay_position 8"
bind 0 "spec_player_by_overlay_position 9"

bind mwheelup select_next_alive_player_in_overlay
bind mwheeldown select_previous_alive_player_in_overlay
// Ideally these replace spec_next and spec_previous
bind mouse2 spec_next_entity_in_overlay
bind mouse1 spec_previous_entity_in_overlay

bind mouse5 spec_player_under_mouse
bind mouse4 spec_fastest_player

bind i spec_last_event
bind o spec_last_hurt
bind p spec_last_shooter
bind j spec_last_attacker
bind k spec_last_killer
bind l spec_last_ghoster
